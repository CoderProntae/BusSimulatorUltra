name: Build APK

on:
  push:
    branches: [arena/019f9a03-bussimulatorultra, main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          build-tools-version: '34.0.0'
          api-level: 34
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/godot_bin
            ${{ github.workspace }}/export_templates/4.4.1-stable
          key: godot-441-${{ github.run_id }}
      - run: mkdir -p ${{ github.workspace }}/build
      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/godot_bin
          wget --show-progress -O ${{ github.workspace }}/godot_bin/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -o ${{ github.workspace }}/godot_bin/godot.zip -d ${{ github.workspace }}/godot_bin/
          chmod +x ${{ github.workspace }}/godot_bin/Godot_v4.4.1-stable_linux.x86_64
          rm ${{ github.workspace }}/godot_bin/godot.zip
      - name: Download templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/export_templates/4.4.1-stable
          wget -q -O /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" || true
          if [ -f /tmp/templates.tpz ]; then
            unzip -o /tmp/templates.tpz -d /tmp/ || true
            cp -r /tmp/templates/* ${{ github.workspace }}/export_templates/4.4.1-stable/ 2>/dev/null || true
            rm -rf /tmp/templates.tpz /tmp/templates
          fi
      - name: Verify binary
        run: |
          BIN="${{ github.workspace }}/godot_bin/Godot_v4.4.1-stable_linux.x86_64"
          if [ ! -f "$BIN" ]; then echo "BINARY MISSING"; ls -la ${{ github.workspace }}/godot_bin/; exit 1; fi
          $BIN --version
      - name: Export
        env:
          GODOT: ${{ github.workspace }}/godot_bin/Godot_v4.4.1-stable_linux.x86_64
        run: |
          $GODOT --headless --export-release "Android (Release)" ${{ github.workspace }}/build/BusSimulatorUltra.apk 2>&1 | tee ${{ github.workspace }}/build/export.log
      - name: Check
        run: |
          APK="${{ github.workspace }}/build/BusSimulatorUltra.apk"
          if [ -f "$APK" ]; then echo "SUCCESS: $(ls -lh $APK)"; else echo "FAILED"; cat ${{ github.workspace }}/build/export.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK
          path: ${{ github.workspace }}/build/BusSimulatorUltra.apk
