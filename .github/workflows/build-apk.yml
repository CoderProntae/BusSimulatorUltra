name: Build Bus Simulator Ultra APK (Fully Automated)

on:
  push:
    branches: [arena/019f9a03-bussimulatorultra, main]
  pull_request:
    branches: [arena/019f9a03-bussimulatorultra, main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          build-tools-version: '34.0.0'
          api-level: 34

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Godot + Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot_bin
            ~/.local/share/godot/export_templates/4.4.1-stable
          key: godot-441-templates-${{ github.run_id }}

      - name: Download Godot 4.4.1 Binary
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot_bin
          wget -q -O ~/godot_bin/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
          unzip -q ~/godot_bin/godot.zip -d ~/godot_bin/
          chmod +x ~/godot_bin/Godot_v4.4.1-stable_linux.x86_64
          rm ~/godot_bin/godot.zip

      - name: Download Godot Android Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1-stable
          # Download full export template package
          wget -q -O /tmp/godot_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          unzip -q /tmp/godot_templates.tpz -d /tmp/
          # Extract android templates into correct location
          cp -r /tmp/templates/android* ~/.local/share/godot/export_templates/4.4.1-stable/ || true
          cp -r /tmp/templates/*.apk ~/.local/share/godot/export_templates/4.4.1-stable/ || true
          cp -r /tmp/templates/android_source.zip ~/.local/share/godot/export_templates/4.4.1-stable/ || true
          rm -rf /tmp/godot_templates.tpz /tmp/templates
          ls -la ~/.local/share/godot/export_templates/4.4.1-stable/

      - name: Verify Godot binary
        run: |
          ~/godot_bin/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Verify templates exist
        run: |
          ls -la ~/.local/share/godot/export_templates/4.4.1-stable/
          test -f ~/.local/share/godot/export_templates/4.4.1-stable/android_source.zip || echo "WARNING: android_source.zip missing"

      - name: Build APK (headless)
        env:
          GODOT: ~/godot_bin/Godot_v4.4.1-stable_linux.x86_64
        run: |
          $GODOT --headless --export-release "Android (Release)" build/BusSimulatorUltra.apk 2>&1 | tee build/export.log

      - name: Check APK result
        run: |
          if [ -f build/BusSimulatorUltra.apk ]; then
            echo "APK SUCCESS! Size: $(ls -lh build/BusSimulatorUltra.apk | awk '{print $5}')"
            sha256sum build/BusSimulatorUltra.apk > build/BusSimulatorUltra.apk.sha256
          else
            echo "APK FAILED. Log:"
            cat build/export.log || echo "No log file"
            exit 1
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BusSimulatorUltra-APK
          path: |
            build/BusSimulatorUltra.apk
            build/BusSimulatorUltra.apk.sha256
            build/export.log
          retention-days: 30
